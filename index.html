<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>שולחן האבירים – דוראק, קאבו, שיטהד</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#c9a35a;--gold-l:#ecd49a;--gold-d:#7d5e22;--ink:#0b0d0b;--line:rgba(201,163,90,.42);--txt:#ece4cf;--mut:#a29882;--red:#b0121e;--cw:46px;--felt:#14704a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:Heebo,system-ui,sans-serif;color:var(--txt);background:
 radial-gradient(ellipse 90% 55% at 50% 30%,rgba(255,196,120,.16) 0%,transparent 70%),
 repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 1px,transparent 1px 64px),
 linear-gradient(180deg,#24160d 0%,#150d07 55%,#0a0604 100%);background-attachment:fixed;overflow-x:hidden;user-select:none;-webkit-user-select:none}
button{font-family:inherit;cursor:pointer}
.serif{font-family:'Frank Ruhl Libre',serif}
.screen{max-width:500px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 22px)}

/* ---------- title ---------- */
.title{text-align:center;margin:6px 0 18px}
.title h1{font-family:'Frank Ruhl Libre',serif;font-weight:900;font-size:56px;line-height:1;margin:0;letter-spacing:1px;
 background:linear-gradient(180deg,#fbe9b7 0%,#d4af5a 48%,#8a6a24 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 2px 0 rgba(0,0,0,.6))}
.title .sub{font-family:'Frank Ruhl Libre',serif;font-size:17px;color:var(--gold);letter-spacing:3px;margin-top:6px}
.orn{display:flex;align-items:center;gap:10px;justify-content:center;color:var(--gold);font-size:11px;margin:8px auto 0;width:70%}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.orn::after{background:linear-gradient(-90deg,transparent,var(--gold))}

.panel{background:linear-gradient(180deg,#132019,#0b140f);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;
 box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.04)}
.panel h3{margin:0 0 10px;font-family:'Frank Ruhl Libre',serif;font-weight:700;font-size:15px;color:var(--gold-l);letter-spacing:.5px}
.heroes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hero{background:rgba(255,255,255,.02);border:1px solid rgba(212,175,90,.18);border-radius:12px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--txt);transition:.15s}
.hero .shield{width:40px;height:48px}
.hero b{font-size:13px;font-weight:700}
.hero small{font-size:10.5px;color:var(--mut)}
.hero.on{border-color:var(--gold);background:radial-gradient(circle at 50% 30%,rgba(212,175,90,.18),rgba(212,175,90,.03));box-shadow:0 0 0 1px var(--gold) inset}
.hdesc{margin:12px 2px 0;font-size:13.5px;color:#cfc7b2;line-height:1.5}
.hdesc b{color:var(--gold-l)}
.seg{display:flex;gap:6px;margin-bottom:12px;background:#08100b;border:1px solid rgba(212,175,90,.2);border-radius:10px;padding:4px}
.seg button{flex:1;padding:8px 0;border:0;border-radius:7px;background:transparent;color:#bdb5a1;font-weight:600;font-size:14.5px}
.seg button.on{background:linear-gradient(180deg,#e6c76f,#b8902f);color:#1a1408;font-weight:700}
.seg button:disabled{opacity:.3}
.btn{border:1px solid #6b5627;border-radius:11px;background:linear-gradient(180deg,#1d2b22,#111a14);color:var(--gold-l);font-weight:600;padding:11px 14px;font-size:14.5px;
 box-shadow:0 4px 12px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.05);transition:transform .08s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,#ecd082,#b98f2e);color:#1a1408;border-color:#f3dc95;font-weight:700}
.btn.danger{background:linear-gradient(180deg,#9a1d27,#5d0e15);color:#f8e8c4;border-color:#c9a24a}
.btn.ghost{background:transparent}
.btn.on{background:linear-gradient(180deg,#4b2a6b,#2b1740);border-color:#b48be0;color:#efe2ff}
.btn:disabled{opacity:.35}
.big{display:block;width:100%;padding:15px;font-size:17px;margin-bottom:10px;font-family:'Frank Ruhl Libre',serif;letter-spacing:.5px}
.link{display:block;margin:10px auto 0;background:none;border:0;color:var(--gold);font-size:14px;text-decoration:underline;text-underline-offset:4px}
.note{color:var(--mut);font-size:12.5px;text-align:center;margin-top:12px;line-height:1.5}

/* ---------- lobby ---------- */
.clock{position:relative;width:170px;height:170px;margin:4px auto 16px}
.clock svg{width:100%;height:100%;transform:rotate(-90deg)}
.clock .n{position:absolute;inset:0;display:grid;place-items:center;font-family:'Frank Ruhl Libre',serif;font-size:52px;font-weight:700;color:var(--gold-l)}
.clock .n small{display:block;font-size:12px;color:var(--mut);font-family:Heebo;text-align:center;margin-top:-6px;font-weight:500}
.linkbox{display:flex;gap:8px;align-items:center}
.linkbox code{flex:1;background:#08100b;border:1px solid rgba(212,175,90,.3);border-radius:9px;padding:10px;font-size:14.5px;direction:ltr;text-align:left;color:var(--gold-l)}
.seats{display:grid;gap:8px}
.seatrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid rgba(212,175,90,.25);border-radius:10px;background:rgba(255,255,255,.02)}
.seatrow .shield{width:28px;height:34px}
.seatrow.empty{border-style:dashed;color:var(--mut)}
.ok-tag{margin-inline-start:auto;color:#7fc28e;font-size:13px;font-weight:600}
.pulse{animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.35}}

/* ---------- game ---------- */
#game{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:520px;margin:0 auto;
 padding:calc(env(safe-area-inset-top) + 6px) 10px calc(env(safe-area-inset-bottom) + 8px);gap:6px}
.top{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut)}
.top .sp{flex:1}
.ib{white-space:nowrap;background:transparent;color:var(--gold-l);border:1px solid rgba(212,175,90,.35);border-radius:8px;padding:5px 10px;font-size:13px}
.chip{border:1px solid rgba(212,175,90,.3);border-radius:20px;padding:3px 10px;color:var(--gold-l);white-space:nowrap}
.arena{flex:1;min-height:0;display:grid;place-items:center;position:relative}
.rt{position:relative;width:min(88vw,430px,calc(100dvh - 330px));aspect-ratio:1;border-radius:50%}
.rt .rim{position:absolute;inset:0;border-radius:50%;
 background:radial-gradient(circle at 50% 50%,transparent 60%,rgba(0,0,0,.35) 61%,transparent 64%),
  repeating-radial-gradient(circle at 50% 50%,#4d1a0e 0 2px,#5e2313 2px 5px,#521d10 5px 8px,#40150a 8px 9px);
 box-shadow:0 34px 70px rgba(0,0,0,.75),0 0 0 2px #230a04,0 0 0 4px var(--gold-d),0 0 0 6px #1a0703,inset 0 0 30px rgba(0,0,0,.6)}
.rt .rim::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 20%,rgba(255,210,150,.16),transparent 55%)}
.rt .inlay{position:absolute;inset:13%;border-radius:50%;
 background:radial-gradient(circle at 50% 34%,rgba(255,236,170,.16) 0%,transparent 55%),
  repeating-linear-gradient(35deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px),
  radial-gradient(circle at 50% 45%,#1d8a57 0%,#16754a 45%,#0f5c39 78%,#0a4329 100%);
 box-shadow:0 0 0 2px #2b0d05,0 0 0 3.5px var(--gold-d),inset 0 0 0 7px #0f5a37,inset 0 0 0 8px rgba(0,0,0,.35),inset 0 10px 28px rgba(0,0,0,.5)}
.dia{position:absolute;width:7px;height:7px;transform:translate(-50%,-50%) rotate(45deg);background:linear-gradient(135deg,#f6e2a8,#a57f30);box-shadow:0 0 0 1px #3a1a08;z-index:1}
.rt .crest{position:absolute;inset:30%;opacity:.13;pointer-events:none}
.pile{position:absolute;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;z-index:2}
.pile.deck{right:3%}.pile.disc{left:3%}
.pile .lbl{font-size:10.5px;color:var(--gold-l);background:rgba(4,20,12,.72);border:1px solid rgba(212,175,90,.3);border-radius:10px;padding:1px 7px;white-space:nowrap}
.stack{position:relative;width:calc(var(--cw)*1.0);height:calc(var(--cw)*1.4)}
.stack .card{position:absolute;inset:0}
.stack .tr{transform:translateX(-48%) rotate(90deg);transform-origin:50% 50%}
.stack .back{position:absolute;inset:0}
.disc .back:nth-child(2){transform:rotate(14deg)}.disc .back:nth-child(3){transform:rotate(-9deg)}
.tbl{position:absolute;inset:22% 21%;display:flex;flex-wrap:wrap;gap:10px 6px;justify-content:center;align-content:center;direction:ltr;z-index:3}
.pair{position:relative;width:calc(var(--cw) + 9px);height:calc(var(--cw)*1.4 + 12px)}
.pair .card{position:absolute;top:0;left:0}
.pair .card.d{top:12px;left:9px;transform:rotate(8deg)}
.pair.hit .card.a{box-shadow:0 0 0 2px var(--gold-l),0 0 14px 2px rgba(240,217,153,.6)}
.tcount{position:absolute;bottom:17%;left:50%;transform:translateX(-50%);font-size:10.5px;color:var(--gold);letter-spacing:.5px;z-index:2;white-space:nowrap;opacity:.9}
.hint{color:rgba(225,245,232,.55);font-family:'Frank Ruhl Libre',serif;font-size:14px;text-align:center;align-self:center}

/* seats */
.seat{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;z-index:4;width:92px}
.med{position:relative;width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#3a2416,#140b06);
 box-shadow:0 0 0 1.5px var(--gold),0 6px 14px rgba(0,0,0,.7);display:grid;place-items:center}
.med .shield{width:34px;height:41px}
.tring{position:absolute;inset:-5px;width:68px;height:68px;transform:rotate(-90deg);pointer-events:none}
.tring circle{fill:none;stroke-width:3.5}
.tring .bg{stroke:rgba(0,0,0,.6)}
.tring .fg{stroke:var(--gold-l);stroke-dasharray:201;stroke-linecap:round;transition:stroke-dashoffset .1s linear}
.tring .fg.low{stroke:#e04a55}
.plate{margin-top:-2px;background:linear-gradient(180deg,#2a1a10,#160d07);border:1px solid rgba(212,175,90,.5);border-radius:8px;padding:2px 8px;text-align:center;min-width:70px;position:relative;z-index:1}
.plate b{display:block;font-size:12.5px;color:var(--txt);font-weight:700;line-height:1.3;white-space:nowrap}
.plate span{font-size:10.5px;color:var(--gold-l);display:inline-flex;align-items:center;gap:4px}
.plate span::before{content:"";width:8px;height:11px;border-radius:1.5px;background:linear-gradient(135deg,#6a1420,#3d0a11);border:1px solid var(--gold-d)}
.role{position:absolute;top:-10px;font-size:10px;font-weight:700;border-radius:10px;padding:1px 7px;letter-spacing:.3px;z-index:2}
.role.att{background:#7a1520;color:#f8e3c0;border:1px solid #c9a24a}
.role.def{background:#1d3a63;color:#dbe8ff;border:1px solid #7e9cc7}
.seat.turn .med{box-shadow:0 0 0 2px var(--gold-l),0 0 22px rgba(240,217,153,.45),0 6px 14px rgba(0,0,0,.7)}
.seat.out{opacity:.45;filter:grayscale(.8)}
.seat.tell .med{animation:tell .22s 7}
.seat.tell .plate span{animation:flick .22s 7}
@keyframes tell{0%,100%{transform:none}25%{transform:translateX(-2px) rotate(-4deg)}75%{transform:translateX(2px) rotate(4deg);box-shadow:0 0 0 2px var(--c),0 0 18px 4px var(--c)}}
@keyframes flick{50%{color:#ff6b75}}
.lost{position:absolute;top:-2px;left:-2px;width:18px;height:18px;border-radius:50%;background:#5d0e15;border:1px solid var(--gold);font-size:11px;display:grid;place-items:center;color:#f8e3c0}

/* portraits */
.pt{display:block;border-radius:50%}
.med .pt{width:52px;height:52px}
.hero .pt{width:50px;height:50px}
.seatrow .pt{width:32px;height:32px}
.sb .pt,.endl .pt{width:24px;height:24px;display:inline-block;vertical-align:middle;margin-inline-end:6px}
/* scoreboard */
.sb{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.sb th{color:var(--gold-l);font-weight:600;font-size:11.5px;padding:6px 3px;border-bottom:1px solid rgba(201,163,90,.35);cursor:pointer;white-space:nowrap}
.sb th.on{color:#fff}
.sb td{padding:6px 3px;text-align:center;border-bottom:1px solid rgba(201,163,90,.12)}
.sb td.nm{text-align:right;white-space:nowrap}
.sb td.pts{font-weight:700;color:#8fe0a8;font-size:15px}
.sb td.pts.neg{color:#ff8a92}
.sb td.pts.zero{color:var(--mut)}
.sb tr.me td{background:rgba(201,163,90,.10)}
.endl .nm small{display:block;color:var(--mut);font-size:11.5px;margin-inline-start:30px;margin-top:-2px}
.gp{font-weight:800;font-size:18px;color:var(--mut)}.gp.pos{color:#8fe0a8}.gp.neg{color:#ff8a92}
.hist{display:grid;gap:6px}
.hrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px}
.hn{color:var(--mut);min-width:28px}
.hp{border:1px solid rgba(201,163,90,.25);border-radius:10px;padding:1px 7px;color:var(--mut)}
.hp.pos{color:#8fe0a8;border-color:rgba(143,224,168,.4)}.hp.neg{color:#ff8a92;border-color:rgba(255,138,146,.4)}
/* card-count fan + badge */
.fan{position:absolute;left:50%;top:29px;width:0;height:0;z-index:0;pointer-events:none}
.fan i{position:absolute;left:-12px;bottom:0;width:24px;height:34px;border-radius:3px;transform-origin:50% 140%;
 background:repeating-linear-gradient(45deg,rgba(201,163,90,.3) 0 1px,transparent 1px 4px),repeating-linear-gradient(-45deg,rgba(201,163,90,.3) 0 1px,transparent 1px 4px),linear-gradient(160deg,#6e1622,#3c0a12);
 box-shadow:0 0 0 1px #1a0508,inset 0 0 0 1.5px rgba(201,163,90,.7),0 2px 4px rgba(0,0,0,.5);margin-bottom:22px}
.seat .med{z-index:1}
.cntb{position:absolute;bottom:-4px;left:-12px;min-width:30px;height:30px;padding:0 6px;border-radius:15px;display:grid;place-items:center;
 background:linear-gradient(180deg,#f3dc95,#b98f2e);color:#1a1006;font:800 17px/1 Heebo,sans-serif;box-shadow:0 0 0 2px #1a0d05,0 3px 8px rgba(0,0,0,.6);z-index:3}
.seat.mine .cntb{min-width:26px;height:26px;font-size:15px}
.seat.tell .cntb{animation:flickb .22s 7}
@keyframes flickb{50%{background:#e04a55;color:#fff}}
.seat .role{top:auto;bottom:-14px}
.trumpchip{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(180deg,#f3dc95,#b98f2e);color:#1a1006;border-radius:20px;padding:2px 12px 2px 10px;font-weight:700;font-size:13.5px;box-shadow:0 0 0 1px #1a0d05,0 2px 8px rgba(0,0,0,.5)}
.trumpchip b{font-size:21px;line-height:1;color:#15171c;background:#fffdf6;border-radius:50%;width:26px;height:26px;display:grid;place-items:center;box-shadow:0 0 0 1px #6b5627}
.trumpchip b.red{color:var(--red)}
.btn.transfer{background:linear-gradient(180deg,#1f6b48,#0f4229);color:#eaf7ee;border-color:#c9a35a}
.deck .trlbl{font-size:10px;font-weight:700;color:#1a1006;background:linear-gradient(180deg,#f3dc95,#b98f2e);border-radius:8px;padding:0 6px}
/* cards */
.card{width:var(--cw);height:calc(var(--cw)*1.4);border-radius:calc(var(--cw)*.1);position:relative;flex:none;color:#15171c;
 background:linear-gradient(160deg,#fffdf6 0%,#f3ecdb 100%);box-shadow:0 0 0 1px rgba(0,0,0,.55),0 3px 8px rgba(0,0,0,.45);font-family:'Frank Ruhl Libre',serif}
.card.red{color:var(--red)}
.card .ix{position:absolute;top:calc(var(--cw)*.06);left:calc(var(--cw)*.09);font-weight:700;font-size:calc(var(--cw)*.3);line-height:.95;text-align:center;display:flex;flex-direction:column;align-items:center}
.card .ix i{font-style:normal;font-size:calc(var(--cw)*.26);font-family:Heebo,sans-serif}
.card .ix.b{top:auto;left:auto;bottom:calc(var(--cw)*.06);right:calc(var(--cw)*.09);transform:rotate(180deg)}
.card .pip{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--cw)*.62);font-family:Heebo,sans-serif}
.card .ace{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--cw)*.85);font-family:Heebo,sans-serif}
.card .fc{position:absolute;inset:22% 20%;border:1px solid currentColor;border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;
 background:linear-gradient(180deg,rgba(212,175,90,.18),rgba(212,175,90,.04));box-shadow:inset 0 0 0 2px rgba(212,175,90,.35)}
.card .fl{font-size:calc(var(--cw)*.42);font-weight:900;line-height:1}
.card .fs{font-size:calc(var(--cw)*.28);font-family:Heebo,sans-serif;line-height:1}
.card.trump{box-shadow:0 0 0 1px rgba(0,0,0,.55),0 0 0 2.5px var(--gold),0 3px 8px rgba(0,0,0,.45)}
.card.trump::after{content:"";position:absolute;top:0;right:0;width:0;height:0;border-style:solid;border-width:0 calc(var(--cw)*.26) calc(var(--cw)*.26) 0;
 border-color:transparent var(--gold) transparent transparent;border-top-right-radius:calc(var(--cw)*.1)}
.back{width:var(--cw);height:calc(var(--cw)*1.4);border-radius:calc(var(--cw)*.1);
 background:
  radial-gradient(circle at 50% 50%,rgba(212,175,90,.0) 0 22%,transparent 23%),
  repeating-linear-gradient(45deg,rgba(212,175,90,.28) 0 1px,transparent 1px 6px),
  repeating-linear-gradient(-45deg,rgba(212,175,90,.28) 0 1px,transparent 1px 6px),
  linear-gradient(160deg,#6e1622,#3c0a12);
 box-shadow:0 0 0 1px #1a0508,inset 0 0 0 2px #3c0a12,inset 0 0 0 3px rgba(212,175,90,.75),0 3px 8px rgba(0,0,0,.5)}
.deal{animation:deal .32s cubic-bezier(.2,.8,.3,1)}
@keyframes deal{0%{transform:translateY(40px) scale(.85);opacity:0}}
.pair .card.d.deal{animation:deald .32s cubic-bezier(.2,.8,.3,1)}
@keyframes deald{0%{transform:translateY(40px) rotate(0) scale(.85);opacity:0}100%{transform:rotate(8deg)}}

/* bottom */
.status{display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,#132019,#0b140f);border:1px solid var(--line);border-radius:12px;padding:7px 10px;min-height:46px}
.status .msg{flex:1;font-size:14px;line-height:1.3}
.status .msg b{color:var(--gold-l);font-weight:700}
.status .msg small{display:block;color:var(--mut);font-size:12px}
.tnum{font-family:'Frank Ruhl Libre',serif;font-size:26px;font-weight:700;color:var(--gold-l);min-width:30px;text-align:center}
.tnum.low{color:#ff6b75}
.tbarw{height:3px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden;margin-top:-3px}
.tbar{height:100%;background:linear-gradient(90deg,var(--gold-d),var(--gold-l));transform-origin:right;transition:transform .1s linear}
.tbar.low{background:#d23a46}
.hand{display:flex;justify-content:center;align-items:flex-end;padding:16px 4px 2px;min-height:96px;direction:ltr;--cw:54px}
.hand .card{margin-left:var(--ov,-8px);transition:transform .15s,opacity .15s,box-shadow .15s;cursor:pointer}
.hand .card:first-child{margin-left:0}
.hand.my .card.no{opacity:.5}
.hand .card.sel{opacity:1!important;transform:translateY(-14px);z-index:2;box-shadow:0 0 0 2px var(--gold-l),0 0 16px rgba(240,217,153,.55),0 6px 12px rgba(0,0,0,.5)}
.hand.cheaty .card{opacity:1!important;box-shadow:0 0 0 1.5px #b48be0,0 3px 8px rgba(0,0,0,.45)}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:6px}
.acts .btn{padding:10px 4px;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast{position:absolute;top:8%;left:50%;transform:translateX(-50%);background:rgba(10,12,17,.92);border:1px solid var(--gold);color:var(--gold-l);
 border-radius:20px;padding:6px 14px;font-size:13px;z-index:6;white-space:nowrap;animation:tin .25s}
@keyframes tin{0%{opacity:0;transform:translate(-50%,-6px)}}

/* overlays */
.ov{position:fixed;inset:0;background:rgba(4,5,8,.72);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:grid;place-items:center;z-index:30;padding:20px}
.ov.np{pointer-events:none;background:rgba(4,5,8,.45)}
.sheet{background:linear-gradient(180deg,#14221a,#0b140f);border:1px solid var(--gold-d);border-radius:16px;padding:18px;width:100%;max-width:380px;max-height:86vh;overflow:auto;
 box-shadow:0 30px 80px rgba(0,0,0,.7),inset 0 0 0 4px #0b140f,inset 0 0 0 5px rgba(212,175,90,.25)}
.sheet h2{margin:0 0 8px;font-family:'Frank Ruhl Libre',serif;color:var(--gold-l);font-weight:700;font-size:22px}
.sheet p{margin:6px 0;font-size:14px;line-height:1.55;color:#d6cfbd}
.sheet p b{color:var(--gold-l)}
.sheet .btn{display:block;width:100%;margin-top:8px;text-align:right;padding:11px 13px}
.sheet .btn small{display:block;font-weight:400;font-size:12px;opacity:.75;margin-top:1px}
.verdict{text-align:center;animation:vin .35s ease-out}
.verdict h1{font-family:'Frank Ruhl Libre',serif;font-size:50px;margin:0 0 8px;font-weight:900;color:#e04a55;letter-spacing:1px;text-shadow:0 4px 20px rgba(224,74,85,.35)}
.verdict.false h1{color:#8fb3e8;text-shadow:0 4px 20px rgba(143,179,232,.3)}
@keyframes vin{0%{transform:scale(.9);opacity:0}}
.peek{display:flex;gap:8px;justify-content:center;margin:12px 0;direction:ltr;--cw:56px}
.endl{list-style:none;padding:0;margin:8px 0}
.endl li{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid rgba(212,175,90,.15);font-size:14px}


/* online + many players */
.inp{width:100%;background:#08100b;border:1px solid rgba(201,163,90,.35);border-radius:10px;padding:11px 12px;color:var(--gold-l);font:500 15px Heebo,sans-serif;outline:none}
.inp:focus{border-color:var(--gold)}
.joinrow{display:flex;gap:8px}.joinrow .inp{flex:1;text-align:left}
.bigcode{font-family:'Frank Ruhl Libre',serif;font-size:46px;font-weight:900;letter-spacing:8px;text-align:center;color:var(--gold-l);background:#08100b;border:1px dashed rgba(201,163,90,.5);border-radius:12px;padding:6px 0}
.code{color:#fff;letter-spacing:2px}
.panel.invite{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 10px 30px rgba(0,0,0,.45)}
.pile{top:61%!important}
.heroes.mini .pt{width:42px;height:42px}
.heroes.mini b{font-size:11.5px;line-height:1.25;text-align:center}
.inp.err{border-color:#e04a55}
.gsel{margin:-6px 0 6px}.gsel button{font-family:'Frank Ruhl Libre',serif;font-size:16px}
.gdesc{color:#cfc7b2;font-size:13px;text-align:center;margin:0 6px 14px;line-height:1.5}
.gchip{font-family:'Frank Ruhl Libre',serif;color:var(--gold-l);font-size:15px;font-weight:700}
.tbl.center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.rulechip{font-size:11.5px;color:var(--gold-l);background:rgba(4,20,12,.72);border:1px solid rgba(201,163,90,.35);border-radius:10px;padding:2px 9px;white-space:nowrap}
.card.xs{--cw:22px;box-shadow:0 0 0 1px rgba(0,0,0,.5)}
.card.xs .ix.b,.card.xs .pip,.card.xs .ace,.card.xs .fc{display:none}
.card.xs .ix{font-size:10px;top:1px;left:2px}.card.xs .ix i{font-size:9px}
.mini-up{display:flex;gap:2px;margin-top:3px;direction:ltr;align-items:center;justify-content:center}
.mini-up .dn,.mini-slots .dn{font-size:10px;color:var(--gold-l);margin-inline-start:2px}
.mini-slots{display:flex;gap:2px;margin-top:3px;direction:ltr;justify-content:center;flex-wrap:wrap;max-width:84px}
.mini-slots .mb{width:15px;height:21px;border-radius:2px;background:linear-gradient(160deg,#6e1622,#3c0a12);box-shadow:0 0 0 1px #1a0508,inset 0 0 0 1px rgba(201,163,90,.6);cursor:pointer;display:block}
.card.peek{box-shadow:0 0 0 2px #7fd1ff,0 0 12px rgba(127,209,255,.6)}
.shpile{position:relative;display:flex;direction:ltr}
.shpile .card{margin-left:-28px}.shpile .card:first-child{margin-left:0}
.shpile .card.p1{transform:rotate(6deg)}.shpile .card.p2{transform:rotate(-5deg)}
.back.burn{filter:grayscale(.6) brightness(.6)}
.myarea{display:flex;justify-content:center;padding-top:4px}
.slots3{display:flex;gap:10px;direction:ltr}
.slot{position:relative;width:48px;height:66px}
.slot .back,.slot .card{position:absolute;top:0;left:0;--cw:46px}
.slot .card.up{top:-6px;left:2px}
.slot .back{width:46px;height:64px}
.back.flip{box-shadow:0 0 0 2px var(--gold-l),0 0 14px rgba(240,217,153,.5);cursor:pointer}
.cslots{direction:ltr}
.cslot{--cw:58px;cursor:pointer}
.cslot .back.big{width:58px;height:81px}
.cslot.tap .back{box-shadow:0 0 0 2px var(--gold-l),0 0 12px rgba(240,217,153,.45)}
.cabo-mid{display:flex;gap:12px;direction:ltr;align-items:flex-end}
.cpile{display:flex;flex-direction:column;align-items:center;gap:4px}
.cpile .lbl{font-size:10.5px;color:var(--gold-l);background:rgba(4,20,12,.72);border:1px solid rgba(201,163,90,.3);border-radius:10px;padding:1px 7px;white-space:nowrap}
.cpile.drawn .card{box-shadow:0 0 0 2px var(--gold-l),0 0 16px rgba(240,217,153,.6)}
.card.joker{color:#15171c}.card.joker.red{color:var(--red)}
.card.joker .ix{font-size:calc(var(--cw)*.22)}
.cards-line{white-space:normal}
.g-cabo .tbl,.g-shit .tbl{inset:24% 18%}
.chatbtn{position:relative}
.unread{position:absolute;top:-7px;left:-7px;background:#e04a55;color:#fff;border-radius:10px;min-width:18px;height:18px;font-size:11px;display:grid;place-items:center;padding:0 4px;font-weight:700}
.chatp{position:fixed;inset:0;z-index:40;background:rgba(4,5,8,.45);display:flex;align-items:flex-end;justify-content:center}
.chatp.hidden,.chat-st.hidden{display:none}
.chat-sheet{width:100%;max-width:520px;height:min(72vh,560px);background:linear-gradient(180deg,#14221a,#0b140f);border:1px solid var(--gold-d);border-bottom:0;border-radius:18px 18px 0 0;
 display:flex;flex-direction:column;padding:10px 10px calc(env(safe-area-inset-bottom) + 10px);box-shadow:0 -20px 60px rgba(0,0,0,.6)}
.chat-h{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 8px;color:var(--gold-l);font-family:'Frank Ruhl Libre',serif;font-size:18px}
.chat-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:6px 2px}
.cm{display:flex;gap:8px;align-items:flex-end;max-width:85%}
.cm .pt{width:28px;height:28px;flex:none}
.cm .cb{background:#1d2b22;border:1px solid rgba(201,163,90,.25);border-radius:14px 14px 14px 4px;padding:6px 10px;font-size:14px;line-height:1.35;color:var(--txt);word-break:break-word}
.cm .cb b{display:block;font-size:11.5px;color:var(--gold);font-weight:600}
.cm.mine{align-self:flex-start;flex-direction:row}
.cm.mine .cb{background:#2b2214;border-color:rgba(201,163,90,.5);border-radius:14px 14px 4px 14px}
.cm:not(.mine){align-self:flex-end;flex-direction:row-reverse}
.cstk{display:flex;flex-direction:column;align-items:center;padding:2px 6px}
.cstk span{font-size:44px;line-height:1.1}.cstk small{font-size:12px;color:var(--gold-l);font-weight:700}
.chat-emo{display:flex;gap:2px;overflow-x:auto;padding:6px 0 4px;scrollbar-width:none}
.chat-emo button{background:none;border:0;font-size:24px;padding:2px 4px;flex:none}
.chat-st{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:6px 0;max-height:190px;overflow-y:auto}
.chat-st button{background:#0b140f;border:1px solid rgba(201,163,90,.3);border-radius:12px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;color:var(--gold-l)}
.chat-st span{font-size:30px;line-height:1.1}.chat-st small{font-size:11px;font-weight:600}
.chat-in{display:flex;gap:6px;align-items:center}
.chat-in input{flex:1;min-width:0;background:#08100b;border:1px solid rgba(201,163,90,.35);border-radius:10px;padding:10px;color:var(--txt);font:500 15px Heebo,sans-serif;outline:none}
.chat-in .btn{padding:10px 14px}
.bubble{position:absolute;bottom:calc(100% - 4px);left:50%;transform:translateX(-50%);background:#fffdf6;color:#15171c;border-radius:12px;padding:4px 10px;font-size:13px;font-weight:600;
 white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis;box-shadow:0 4px 14px rgba(0,0,0,.5);z-index:8}
.bubble::after{content:"";position:absolute;top:100%;left:50%;margin-left:-6px;border:6px solid transparent;border-top-color:#fffdf6}
.bubble .be{font-size:28px;line-height:1}
.seat.mine .bubble{bottom:auto;top:-38px}
.btn.wa{background:linear-gradient(180deg,#2bb673,#16804c);color:#fff;border-color:#9be3bd;text-align:center;text-decoration:none;margin:10px 0 8px;font-family:Heebo,sans-serif;font-weight:700}
.sheet .btn.wa{text-align:center}
.linkshow{margin-top:8px;font-size:12px;color:var(--gold-l);background:#08100b;border:1px dashed rgba(201,163,90,.4);border-radius:8px;padding:8px;word-break:break-all;user-select:all;-webkit-user-select:all}
button.chip{background:transparent;font:inherit;cursor:pointer}
/* readable small cards for what the other players have */
.csm{width:26px;height:36px;border-radius:4px;background:linear-gradient(160deg,#fffdf6,#efe7d3);box-shadow:0 0 0 1px rgba(0,0,0,.6),0 2px 4px rgba(0,0,0,.5);
 display:flex;flex-direction:column;align-items:center;justify-content:center;color:#15171c;font-family:'Frank Ruhl Libre',serif;line-height:1}
.csm b{font-size:14px;font-weight:900}.csm i{font-style:normal;font-size:13px;font-family:Heebo,sans-serif}
.csm.red{color:var(--red)}.csm.peek{box-shadow:0 0 0 2px #7fd1ff,0 0 10px rgba(127,209,255,.6)}
.otab{display:flex;gap:3px;margin-top:4px;direction:ltr;justify-content:center}
.oslot{position:relative;width:26px;height:44px}
.oslot .ob{position:absolute;top:0;left:0;width:26px;height:36px;border-radius:4px;background:repeating-linear-gradient(45deg,rgba(201,163,90,.3) 0 1px,transparent 1px 4px),linear-gradient(160deg,#6e1622,#3c0a12);box-shadow:0 0 0 1px #1a0508,inset 0 0 0 1px rgba(201,163,90,.6)}
.oslot .csm{position:absolute;left:0;top:8px}
.ogrid{display:grid;grid-template-columns:repeat(2,auto);gap:3px;margin-top:4px;direction:ltr;justify-content:center}
.ogrid .mb{width:22px;height:31px;border-radius:3px;display:block;cursor:pointer;background:repeating-linear-gradient(45deg,rgba(201,163,90,.3) 0 1px,transparent 1px 4px),linear-gradient(160deg,#6e1622,#3c0a12);box-shadow:0 0 0 1px #1a0508,inset 0 0 0 1px rgba(201,163,90,.6)}
.ogrid .mb.tap{box-shadow:0 0 0 2px var(--gold-l),0 0 8px rgba(240,217,153,.6)}
.ogrid .mb.gone{visibility:hidden}
.ogrid .csm{width:22px;height:31px}.ogrid .csm b{font-size:12px}.ogrid .csm i{font-size:11px}
#game.p5 .oslot,#game.p6 .oslot{width:22px}#game.p5 .csm,#game.p6 .csm,#game.p5 .oslot .ob,#game.p6 .oslot .ob{width:22px;height:31px}
.g-shit .seat,.g-cabo .seat{z-index:4}
.mylbl{width:100%;text-align:center;font-size:11.5px;color:var(--gold);margin-bottom:4px}
.myarea{flex-direction:column;align-items:center}
.slots3{gap:12px}
.slot{width:50px;height:84px}
.slot .back{width:46px;height:64px}
.slot .card.up{top:18px;left:2px;--cw:46px}
.cslots{display:grid;grid-template-columns:repeat(2,auto);gap:8px 10px;justify-content:center}
.cslot{--cw:50px}.cslot .back.big{width:50px;height:70px}.cslot.gone{width:50px;height:70px;border:1px dashed rgba(201,163,90,.25);border-radius:5px}
.top{gap:5px;overflow:hidden;flex-wrap:nowrap}.top>*{flex:none}.top .sp{flex:1 1 0;min-width:0}
.top .ib{padding:5px 8px;font-size:12.5px}.top .chip{padding:3px 8px;font-size:12px}
.trumpchip{padding:2px 9px 2px 7px;font-size:12.5px}.trumpchip b{width:24px;height:24px;font-size:19px}
html,body{max-width:100%;overflow-x:hidden}
.btn.on{background:linear-gradient(180deg,#4b2a6b,#2b1740);border-color:#b48be0;color:#efe2ff}
#game.p5 .seat,#game.p6 .seat{width:78px}
#game.p5 .med,#game.p6 .med{width:50px;height:50px}
#game.p5 .med .pt,#game.p6 .med .pt{width:45px;height:45px}
#game.p5 .tring,#game.p6 .tring{inset:-5px;width:60px;height:60px}
#game.p5 .plate,#game.p6 .plate{min-width:60px;padding:1px 6px}
#game.p5 .plate b,#game.p6 .plate b{font-size:11.5px}
#game.p5 .fan,#game.p6 .fan{top:25px;transform:scale(.85);transform-origin:50% 100%}
#game.p5 .cntb,#game.p6 .cntb{min-width:26px;height:26px;font-size:15px}
#game.p5 .rt,#game.p6 .rt{width:min(84vw,430px,calc(100dvh - 330px))}

function canBeat(a,d){return (d.s===a.s&&d.r>a.r)||(d.s===G.ts&&a.s!==G.ts);}
function tableRanks(){const s=new Set();G.table.forEach(p=>{s.add(p.a.r);if(p.d)s.add(p.d.r);});return s;}
function canThrow(c){return !G.table.length||tableRanks().has(c.r);}
const unbeaten=()=>G.table.filter(p=>!p.d).length;
// at most 6 attack cards per bout, never more than the defender can answer
function canAddMore(){return G.table.length<G.boutDef&&unbeaten()<G.players[G.def].hand.length;}
function nextActive(i){const n=G.players.length;for(let k=1;k<=n;k++){const j=(i+k)%n;if(!G.players[j].out)return j;}return i;}
function removeCard(p,c){const k=p.hand.findIndex(x=>x.id===c.id);if(k>=0)p.hand.splice(k,1);}
function sortHand(p){if(!p)return;p.hand.sort((a,b)=>((a.s===G.ts?100:SUITS.indexOf(a.s)*20)+a.r)-((b.s===G.ts?100:SUITS.indexOf(b.s)*20)+b.r));}
const cheatP=()=>[0.12,0.2,0.28][S.diff];
const nm=(p,self,other)=>(!NET&&p.i===myIdx)?self:p.name+' '+other;
const pname=p=>p.i===myIdx?'אתה':p.name;
function say(m){G.msg=m;}
function toast(t){G.toast={t,until:Date.now()+1900};later(render,2000);}
function noteTo(pi,m){if(pi===myIdx)note(m);else{G.nk=(G.nk||0)+1;G.notes[pi]={m,k:G.nk};}}
function tell(pi){G.tells[pi]=Date.now()+1600;later(render,1700);}
function later(f,ms){setTimeout(f,FAST?0:ms);}
function note(m){V.toast={t:m,until:Date.now()+1900};if(G&&!G.net)say(m);later(render,2000);render();}

function newGame(roster){
 const deck=[];let id=0;
 for(const s of SUITS)for(const r of RANKS[S.deck])deck.push({id:id++,s,r});
 shuffle(deck);
 if(!roster){
  const ok=S.roster&&S.roster.length===S.bots&&S.roster.every(r=>r.hero!==S.hero&&hero(r.hero));
  if(ok)roster=S.roster;
  else{
   const hs=shuffle(HEROES.filter(h=>h.id!==S.hero)),ns=shuffle(BOT_NAMES.slice());
   roster=[];for(let i=0;i<S.bots;i++)roster.push({name:ns[i],hero:hs[i%hs.length].id,kind:'bot'});
   S.roster=roster;save();
  }
 }
 const me0={name:NET?(S.nick||'מארח'):'אתה',hero:S.hero,kind:FAST?'bot':'local'};
 const players=[me0].concat(roster.map(r=>({name:r.name,hero:r.hero,kind:r.kind||'bot',peer:r.peer||null})));
 players.forEach((p,i)=>Object.assign(p,{i,bot:p.kind==='bot',hand:[],out:false,power:S.deck===48?3:2,powerLost:false,lock:0,caughtN:0,catches:0,timeouts:0,place:0}));
 myIdx=0;
 G={players,deck,ts:deck[0].s,trump:deck[0],discard:0,table:[],bout:0,cheats:[],tick:0,nova:{},places:0,scored:false,msg:'',toast:null,flash:null,peek:null,
    tells:{},notes:{},nk:0,over:false,lastId:-1,pauseUntil:0,guard:0,deadline:0,gid:Math.random().toString(36).slice(2,8),unc:[]};
 V={sel:null,pending:null,cheatMode:false,ui:null,toast:null};
 for(let k=0;k<6;k++)for(const p of players)if(G.deck.length)p.hand.push(G.deck.pop());
 sortHand(players[0]);
 let best=null,bi=0;
 players.forEach((p,i)=>p.hand.forEach(c=>{if(c.s===G.ts&&(!best||c.r<best.r)){best=c;bi=i;}}));
 say(best?`${nm(players[bi],'אתה פותח','פותח/ת')} – הקוזר הנמוך ביותר (${cs(best)})`:'');
 screen='game';
 startBout(bi);
}
function startBout(att){
 G.bout++;G.att=att;G.def=nextActive(att);G.table=[];G.phase='attack';
 G.boutDef=Math.min(6,G.players[G.def].hand.length);
 V.sel=null;V.pending=null;
 G.pauseUntil=Math.max(G.pauseUntil,Date.now()+450);
 step();
}
function actor(){
 if(G.phase==='attack')return G.att;
 if(G.phase==='defend')return G.def;
 return G.throwOrder[G.ti];
}
function step(){
 G.tick++;
 if(G.over){render();return;}
 if(G.phase==='attack'&&!G.players[G.att].hand.length){
  if(++G.guard>20){finish();return;}
  updateOuts();if(checkOver())return;
  startBout(nextActive(G.att));return;
 }
 G.guard=0;
 G.deadline=Math.max(Date.now(),G.pauseUntil)+TURN_MS;
 render();
 clearTimeout(timer);clearTimeout(toTimer);
 const a=actor(),t=G.tick,g=G;
 if(G.players[a].bot){
  const wait=FAST?0:Math.max(700+Math.random()*1100,G.pauseUntil-Date.now()+300);
  timer=setTimeout(()=>{if(G===g&&!G.over&&G.tick===t)botAct();},wait);
 }else autoPass(a);
 if(!FAST&&!NOTIMEOUT)toTimer=setTimeout(()=>{if(G===g&&!G.over&&G.tick===t)onTimeout();},G.deadline-Date.now());
}
// the move clock: whoever stalls is penalised and the game moves on
function onTimeout(){
 const a=actor(),p=G.players[a];
 p.timeouts++;
 if(a===myIdx){V.sel=null;V.pending=null;V.cheatMode=false;if(V.ui!=='end')V.ui=null;}
 if(G.phase==='defend'){toast(nm(p,'הזמן נגמר – אתה לוקח','לא הספיק – לוקח'));say(nm(p,'לקחת (זמן)','לוקח (זמן)'));return endBout(false);}
 if(G.phase==='throw'){say(nm(p,'הזמן נגמר – ויתרת','לא הוסיף בזמן'));return doPass();}
 let pen=null;if(G.deck.length){pen=G.deck.pop();p.hand.push(pen);sortHand(p);}
 toast(nm(p,'הזמן נגמר – ','לא תקף בזמן – ')+(pen?'קלף עונשין, ':'')+'התור עובר');
 say(nm(p,'לא תקפת בזמן','לא תקף בזמן'));
 startBout(nextActive(a));
}
function doThrow(pi,c,cheat){
 const p=G.players[pi];
 if(cheat)logCheat(pi,'throw',`${p.name} זרק ${cs(c)} – דרגה שלא הייתה על השולחן`,true);
 removeCard(p,c);G.table.push({a:c,d:null,by:pi});G.lastId=c.id;
 G.phase='defend';
}
function doBeat(pi,idx,c,cheat){
 const p=G.players[pi],pr=G.table[idx];
 if(cheat)logCheat(pi,'beat',`${p.name} הכה ${cs(pr.a)} עם ${cs(c)} – מהלך לא חוקי`,true);
 removeCard(p,c);pr.d=c;G.lastId=c.id;
 if(!unbeaten())return enterThrow();
 step();
}
function enterThrow(){
 if(!canAddMore())return endBout(true);
 // only the player before the defender (attacker) and the player after the defender may add cards
 const order=[];
 for(const j of [G.att,nextActive(G.def)]){const p=G.players[j];if(j!==G.def&&!order.includes(j)&&!p.out&&p.hand.length)order.push(j);}
 if(!order.length)return endBout(true);
 G.throwOrder=order;G.ti=0;G.phase='throw';step();
}
// transfer: before any card is beaten, the defender may pass the attack on with a card of the same rank
function canTransfer(c){
 if(G.phase!=='defend'||!G.table.length||G.table.some(p=>p.d))return false;
 if(!G.table.every(p=>p.a.r===c.r))return false;
 const nd=nextActive(G.def);if(nd===G.def)return false;
 const n=G.table.length+1;return n<=6&&G.players[nd].hand.length>=n;
}
function doTransfer(pi,c){
 const p=G.players[pi];removeCard(p,c);G.table.push({a:c,d:null,by:pi});G.lastId=c.id;
 G.att=pi;G.def=nextActive(pi);G.boutDef=Math.min(6,G.players[G.def].hand.length);
 toast(`${p.name==='אתה'?'העברת':p.name+' מעביר/ה'} ל${G.def===myIdx?'ך':G.players[G.def].name}`);
 step();
}
function doPass(){G.ti++;if(G.ti>=G.throwOrder.length)return endBout(true);step();}
function tableCards(){const a=[];G.table.forEach(p=>{a.push(p.a);if(p.d)a.push(p.d);});return a;}
function endBout(beaten,taker){
 const cards=tableCards();
 if(beaten){G.discard+=cards.length;say('ביטה – הקלפים יצאו מהמשחק');}
 else{const t=G.players[taker??G.def];t.hand.push(...cards);sortHand(t);if(cards.length>=4)botSay(t.i,'pray',0.35);}
 G.table=[];
 refill();updateOuts();
 if(checkOver())return;
 let next;
 if(taker!=null)next=nextActive(taker);
 else if(beaten)next=G.players[G.def].out?nextActive(G.def):G.def;
 else next=nextActive(G.def);
 startBout(next);
}
function refill(){
 const n=G.players.length,order=[];
 for(let k=0;k<n;k++){const j=(G.att+k)%n;if(j!==G.def)order.push(j);}
 order.push(G.def);
 for(const j of order){
  const p=G.players[j];if(p.out)continue;
  while(p.hand.length<6&&G.deck.length)p.hand.push(G.deck.pop());
  if(p.bot&&G.deck.length>2&&Math.random()<cheatP()*0.45){
   p.hand.push(G.deck.pop());
   logCheat(j,'extra',`${p.name} שלף קלף נוסף מהקופה`,false,G.bout+1);
  }
  sortHand(p);
 }
}
function updateOuts(){
 if(G.deck.length)return;
 G.players.forEach(p=>{if(!p.out&&!p.hand.length){p.out=true;p.place=++G.places;}});
}
function checkOver(){
 const act=G.players.filter(p=>!p.out);
 if(act.length<=1){G.over=true;G.durak=act[0]?act[0].i:-1;finish();return true;}
 return false;
}
function finish(){
 G.over=true;clearTimeout(timer);clearTimeout(toTimer);
 G.unc=G.cheats.filter(c=>!c.caught).map(c=>c.text).slice(-8);
 recordScore();V.ui='end';
 if(G.durak>=0)botSay(G.durak,'angry',0.6);G.players.forEach(p=>{if(p.place===1)botSay(p.i,'cool',0.6);});
 render();
}
function logCheat(pi,kind,text,visible,bout){
 const ch={pid:pi,kind,text,visible,bout:bout??G.bout,caught:false,nova:false};
 if(G.nova[pi]&&kind!=='power'){ch.nova=true;G.nova[pi]=false;}
 G.cheats.push(ch);
 if(kind!=='throw'&&kind!=='beat'&&!(pi===myIdx&&!NET))tell(pi);
 if(!G.players[pi].bot)botsWatch(ch);
 return ch;
}

/* ---------- bots ---------- */
function botAct(){
 const pi=actor(),p=G.players[pi];
 maybeBotPower(pi);
 if(G.phase==='attack'){
  const c=botLead(p);doThrow(pi,c,false);say(`${p.name} תוקף עם ${cs(c)}`);step();
 }else if(G.phase==='defend'){
  const m=botDefend(p);
  if(m.take){say(`${p.name} לוקח את הקלפים`);return endBout(false);}
  if(m.transfer){say(`${p.name} מעביר עם ${cs(m.transfer)}`);return doTransfer(pi,m.transfer);}
  say(`${p.name} מכה ${cs(G.table[m.idx].a)} עם ${cs(m.c)}`);
  doBeat(pi,m.idx,m.c,m.cheat);
 }else{
  const m=botThrow(p);
  if(!m){say(`${p.name} ${pi===G.att?'אומר ביטה':'מוותר'}`);return doPass();}
  doThrow(pi,m.c,m.cheat);say(`${p.name} מוסיף ${cs(m.c)}`);step();
 }
}
function botLead(p){
 const s=p.hand.slice().sort(byVal);
 if(S.diff>=1){
  const cnt={};p.hand.forEach(c=>{if(c.s!==G.ts)cnt[c.r]=(cnt[c.r]||0)+1;});
  const pr=s.find(c=>c.s!==G.ts&&cnt[c.r]>=2&&c.r<=10);if(pr)return pr;
 }
 return s[0];
}
function botThrow(p){
 if(!canAddMore()||!p.hand.length)return null;
 const rk=tableRanks();
 const c=p.hand.filter(c=>rk.has(c.r)).filter(c=>!G.deck.length||S.diff===0||(c.s!==G.ts&&c.r<=12)).sort(byVal)[0];
 if(c)return{c,cheat:false};
 if(Math.random()<cheatP()*0.7){
  const x=p.hand.filter(c=>!rk.has(c.r)&&c.s!==G.ts).sort(byVal)[0];
  if(x)return{c:x,cheat:true};
 }
 return null;
}
function botDefend(p){
 const idx=G.table.findIndex(x=>!x.d),a=G.table[idx].a;
 const bs=p.hand.filter(c=>canBeat(a,c)).sort(byVal);
 const tr=p.hand.filter(canTransfer).sort(byVal)[0];
 if(tr&&(tr.s!==G.ts||!bs.length)&&(!bs.length||Math.random()<[0.35,0.55,0.65][S.diff]))return{transfer:tr};
 if(bs.length){
  const b=bs[0];
  if(S.diff>=1&&G.deck.length>4&&b.s===G.ts&&a.s!==G.ts&&b.r>=12&&a.r<=8&&Math.random()<0.5)return{take:true};
  return{idx,c:b,cheat:false};
 }
 if(p.hand.length&&Math.random()<cheatP()*1.5){
  const same=p.hand.filter(c=>c.s===a.s).sort(byVal);
  const c=same.length?same[same.length-1]:p.hand.slice().sort(byVal)[0];
  return{idx,c,cheat:true};
 }
 return{take:true};
}
function maybeBotPower(pi){
 const p=G.players[pi];
 if(p.power<=0||p.powerLost||Math.random()>0.06||p.hand.length<2)return;
 p.power--;
 const h=hero(p.hero);
 if(p.hero==='shadow'){const c=p.hand.slice().sort(byVal)[0];removeCard(p,c);G.discard++;}
 else if((p.hero==='kairo'||p.hero==='sala')&&G.deck.length>2){
  const c=p.hand.slice().sort(byVal)[0];removeCard(p,c);const top=G.deck.pop();G.deck.push(c);p.hand.push(top);sortHand(p);
 }
 logCheat(pi,'power',`${p.name} הפעיל בסתר את "${h.power}"`,false);
}
function botsWatch(ch){
 const bots=shuffle(G.players.filter(p=>p.bot&&!p.out&&p.i!==ch.pid));
 let pv=ch.visible?[0.25,0.5,0.8][S.diff]:[0.08,0.15,0.3][S.diff];
 if(ch.nova)pv*=0.3;
 for(const b of bots){
  if(Math.random()<pv){
   const bout=G.bout,g=G;
   later(()=>{if(G!==g||G.over||ch.caught||G.bout!==bout)return;resolveReveal(b.i,ch.pid);},900+Math.random()*1700);
   return;
  }
 }
}
function botFalseAlarm(target){
 if(Math.random()>[0.03,0.02,0.01][S.diff])return;
 const bots=G.players.filter(p=>p.bot&&!p.out&&p.i!==target);if(!bots.length)return;
 const b=bots[Math.floor(Math.random()*bots.length)],bout=G.bout,g=G;
 later(()=>{if(G!==g||G.over||G.bout!==bout)return;resolveReveal(b.i,target);},1200+Math.random()*1500);
}

/* ---------- reveal ---------- */
function resolveReveal(acc,sus){
 const A=G.players[acc],U=G.players[sus];if(!A||!U||G.over||acc===sus)return;
 const found=G.cheats.filter(c=>c.pid===sus&&!c.caught&&c.bout===G.bout);
 G.pauseUntil=Date.now()+2400;V.sel=null;V.pending=null;
 if(found.length){
  found.forEach(c=>c.caught=true);
  U.powerLost=true;U.caughtN++;A.catches++;botSay(acc,'cop',0.7);botSay(sus,'angry',0.6);
  let bonus='';
  if(A.hand.length>1){const c=A.hand.slice().sort(byVal)[0];removeCard(A,c);G.discard++;bonus=`${nm(A,'השלכת','השליך/ה')} את ${cs(c)}.`;}
  G.flash={type:'bust',title:'נתפס!',body:`${nm(A,'תפסת את','תפס/ה את')} ${U.i===myIdx&&!NET?'הרמאות שלך':U.name}:<br>`+found.map(c=>'• '+c.text).join('<br>')+
   `<br><b>${nm(U,'אתה לוקח','לוקח/ת')} את קלפי השולחן ומאבד/ת את כוח הגיבור.</b> ${bonus}`,until:Date.now()+2600};
  later(render,2700);
  if(G.table.length){
   U.hand.push(...tableCards());sortHand(U);G.table=[];
   refill();updateOuts();if(checkOver())return;
   startBout(nextActive(sus));return;
  }
  for(let k=0;k<2&&G.deck.length;k++)U.hand.push(G.deck.pop());
  sortHand(U);step();
 }else{
  for(let k=0;k<2&&G.deck.length;k++)A.hand.push(G.deck.pop());
  A.lock=G.bout+1;sortHand(A);
  G.flash={type:'false',title:'האשמת שווא',body:`${nm(A,'האשמת','האשים/ה')} את ${U.i===myIdx&&!NET?'אותך':U.name} – אבל לא הייתה רמאות בהתקפה הזו.<br><b>${nm(A,'אתה מקבל','מקבל/ת')} 2 קלפי עונשין.</b>`,until:Date.now()+2400};
  later(render,2500);
  step();
 }
}

/* ---------- actions: every move by a person goes through here (host side) ---------- */
function applyAction(pi,a){
 if(!G||G.over||!a)return;
 const p=G.players[pi];if(!p||p.bot)return;
 const card=id=>p.hand.find(x=>x.id===id);
 switch(a.t){
  case 'play':{
   const c=card(a.c);if(!c||actor()!==pi)return;
   if(G.phase==='attack'||G.phase==='throw'){
    if(G.phase==='throw'&&!canAddMore())return noteTo(pi,'הגעתם למקסימום קלפי התקפה');
    const legal=canThrow(c);if(!legal&&!a.ill)return noteTo(pi,'הקלף לא מתאים לשולחן');
    const ph=G.phase;doThrow(pi,c,!legal);say(`${nm(p,ph==='attack'?'תקפת עם':'הוספת','תוקף עם')} ${cs(c)}`);
    if(legal)botFalseAlarm(pi);
    return step();
   }
   if(G.phase==='defend'){
    let ti=a.ti;if(ti==null){const un=G.table.map((x,i)=>x.d?-1:i).filter(i=>i>=0);if(un.length!==1)return;ti=un[0];}
    const pr=G.table[ti];if(!pr||pr.d)return;
    const legal=canBeat(pr.a,c);if(!legal&&!a.ill)return noteTo(pi,`${cs(c)} לא מכה את ${cs(pr.a)}`);
    say(`${nm(p,'הכית את','מכה את')} ${cs(pr.a)} עם ${cs(c)}`);
    if(legal)botFalseAlarm(pi);
    return doBeat(pi,ti,c,!legal);
   }
   return;}
  case 'transfer':{
   const c=card(a.c);if(!c||actor()!==pi||!canTransfer(c))return noteTo(pi,'אי אפשר להעביר כרגע');
   say(`${nm(p,'העברת עם','מעביר עם')} ${cs(c)}`);botFalseAlarm(pi);return doTransfer(pi,c);}
  case 'take':if(actor()!==pi||G.phase!=='defend')return;say(nm(p,'לקחת את הקלפים','לוקח את הקלפים'));return endBout(false);
  case 'pass':if(actor()!==pi||G.phase!=='throw')return;say(nm(p,pi===G.att?'אמרת ביטה':'ויתרת',pi===G.att?'אומר ביטה':'מוותר'));return doPass();
  case 'extra':{
   if(G.deck.length<2)return noteTo(pi,'אין מספיק קלפים בקופה');
   const c=G.deck.pop();p.hand.push(c);sortHand(p);if(pi===myIdx)G.lastId=c.id;
   logCheat(pi,'extra',`${nm(p,'שלפת','שלף')} קלף נוסף מהקופה`,false);noteTo(pi,`שלפת בשקט ${cs(c)}`);break;}
  case 'drop':{
   const c=card(a.c);if(!c)return;if(p.hand.length<2)return noteTo(pi,'אי אפשר להפיל את הקלף האחרון');
   removeCard(p,c);G.discard++;logCheat(pi,'drop',`${nm(p,'הפלת','הפיל')} את ${cs(c)} מתחת לשולחן`,false);noteTo(pi,`הפלת את ${cs(c)} מתחת לשולחן`);break;}
  case 'power':powerAct(pi,a);break;
  case 'reveal':{
   if(p.lock>=G.bout||!G.players[a.s]||a.s===pi)return;
   return resolveReveal(pi,a.s);}
 }
 render();
}
function powerAct(pi,a){
 const p=G.players[pi];if(p.powerLost||p.power<=0)return noteTo(pi,'אין לך שימושים בכוח');
 const c=a.c!=null?p.hand.find(x=>x.id===a.c):null;
 switch(p.hero){
  case 'kairo':{
   if(!c||G.deck.length<2)return;
   const top=G.deck.pop();G.deck.push(c);removeCard(p,c);p.hand.push(top);sortHand(p);p.power--;
   logCheat(pi,'power',`${nm(p,'החלפת','החליף')} בסתר ${cs(c)} בקלף מהקופה`,false);return noteTo(pi,`החלפת קרן – קיבלת ${cs(top)}`);}
  case 'king':{
   const tgt=[G.def,G.att].concat(G.players.map(x=>x.i)).find(i=>i!==pi&&!G.players[i].out&&G.players[i].hand.length);
   if(tgt==null)return noteTo(pi,'אין במי להציץ');
   const t=G.players[tgt];p.power--;
   G.peek={pi,title:`הצצה ביד של ${t.name}`,cards:shuffle(t.hand.slice()).slice(0,2),until:Date.now()+3000};later(render,3100);
   logCheat(pi,'power',`${nm(p,'הצצת','הציץ')} בקלפים של ${t.name}`,false);return;}
  case 'shadow':

 players.forEach(p=>{p.hand=[];p.up=[];p.down=[];p.ready=p.bot;});
 for(const p of players){for(let k=0;k<3;k++)p.down.push(deck.pop());for(let k=0;k<3;k++)p.up.push(deck.pop());for(let k=0;k<3;k++)p.hand.push(deck.pop());}

 toast(nm(p,'הזמן נגמר – אתה לוקח את הערימה','לא הספיק – לוקח את הערימה'));SH.pickup(p.i);};
SH.play=function(pi,ids){
 const p=G.players[pi],s=SH.src(p);if(G.phase!=='play'||G.turn!==pi||(s!=='hand'&&s!=='up'))return;
 const cards=ids.map(id=>p[s].find(c=>c.id===id)).filter(Boolean);
 if(!cards.length||cards.length!==ids.length||!cards.every(c=>c.r===cards[0].r))return baseNoteTo(pi,'אפשר לשחק רק קלפים מאותו מספר');

 cards.forEach(c=>{p[s].splice(p[s].indexOf(c),1);G.pile.push(c);});G.lastId=cards[cards.length-1].id;

 if(SH.canRank(c.r)){G.pile.push(c);G.lastId=c.id;say(`${nm(p,'הפכת','הפך')} ${cs(c)} – מתאים!`);return SH.after(pi,c.r,1);}

CB.newMatch=function(roster){

 myIdx=0;

CB.newRound=function(){

 G.round++;G.deck=deck;G.discard=[deck.pop()];G.phase='peek';G.turn=(G.round-1)%G.players.length;G.caboBy=-1;G.finalLeft=0;
 G.drawn=null;G.views=[];G.msg='';G.toast=null;G.roundOver=false;G.lastId=G.discard[0].id;G.turns=0;G.pauseUntil=0;
 G.players.forEach(p=>{p.slots=[deck.pop(),deck.pop(),deck.pop(),deck.pop()];p.mem=[null,null,null,null];p.roundScore=null;p.out=false;
  p.mem[2]=p.slots[2];p.mem[3]=p.slots[3];});

 G.players.forEach(p=>{G.views.push({pi:p.i,owner:p.i,k:2,until});G.views.push({pi:p.i,owner:p.i,k:3,until});});
 V={sel:null,pending:null,cheatMode:false,ui:null,toast:null};
 G.deadline=until;G.tick++;
 say('הצצה ראשונית: זכור את שני הקלפים הקדמיים שלך');

CB.view=function(pi,owner,k,ms){G.views.push({pi,owner,k,until:Date.now()+(ms||3000)});later(render,(ms||3000)+80);};
CB.timeout=function(){

 if(G.phase==='turn'){CB.draw(p.i);return CB.discardDrawn(p.i,true);}
 if(G.phase==='drawn'){if(G.drawn.src==='deck')return CB.discardDrawn(p.i,true);const k=p.slots.findIndex(Boolean);return CB.swapIn(p.i,k);}

CB.draw=function(pi){
 if(G.phase!=='turn'||G.turn!==pi)return;
 if(!G.deck.length)return CB.reveal();
 G.drawn={card:G.deck.pop(),src:'deck'};G.phase='drawn';G.tick++;
 say(nm(G.players[pi],'משכת מהקופה','משך מהקופה'));render();
 const g=G,t=G.tick;
 if(G.players[pi].bot){timer=setTimeout(()=>{if(G===g&&G.tick===t)CB.botDrawn();},FAST?0:900);}
};
CB.takeDisc=function(pi,k){
 const p=G.players[pi];if(G.phase!=='turn'||G.turn!==pi||!G.discard.length||!p.slots[k])return;
 G.drawn={card:G.discard.pop(),src:'disc'};G.phase='drawn';
 say(`${nm(p,'לקחת','לקח')} ${CB.label(G.drawn.card)} מהערימה`);

};
CB.swapIn=function(pi,k){
 const p=G.players[pi];if(G.phase!=='drawn'||G.turn!==pi||!p.slots[k])return;
 const old=p.slots[k];p.slots[k]=G.drawn.card;p.mem[k]=G.drawn.card;G.drawn=null;
 G.discard.push(old);G.lastId=old.id;
 say(`${nm(p,'החלפת','החליף')} קלף וזרק ${CB.label(old)}`);

};
CB.discardDrawn=function(pi,silent){

 say(`${nm(p,'זרקת','זרק')} ${CB.label(c)}`);

 if(ab&&!silent){G.phase='ability';G.ab=ab;G.tick++;G.deadline=Date.now()+TURN_MS;render();gTimers(p.bot?()=>CB.botAbility():null,CB.timeout,FAST?0:900);return;}
 CB.endTurn();
};
CB.useAbility=function(pi,a){
 const p=G.players[pi];if(G.phase!=='ability'||G.turn!==pi)return;
 if(a.skip)return CB.endTurn();
 if(G.ab==='peek'&&p.slots[a.k]){CB.view(pi,pi,a.k);p.mem[a.k]=p.slots[a.k];say(nm(p,'הצצת בקלף שלך','הציץ בקלף שלו'));return CB.endTurn();}
 if(G.ab==='spy'){const o=G.players[a.p];if(!o||a.p===pi||!o.slots[a.j])return;CB.view(pi,a.p,a.j);say(`${nm(p,'ריגלת','ריגל')} אחרי ${o.name}`);return CB.endTurn();}
 if(G.ab==='swap'){const o=G.players[a.p];if(!o||a.p===pi||!p.slots[a.k]||!o.slots[a.j]||a.p===G.caboBy)return;
  const t=p.slots[a.k];p.slots[a.k]=o.slots[a.j];o.slots[a.j]=t;p.mem[a.k]=null;o.mem[a.j]=null;
  toast(`${nm(p,'החלפת','החליף')} בסתר קלף עם ${o.i===myIdx?'שלך':o.name}`);return CB.endTurn();}
};
CB.endTurn=function(){
 G.ab=null;G.phase='turn';G.turns++;
 if(G.caboBy>=0){G.finalLeft--;if(G.finalLeft<=0)return CB.reveal();}
 if(!G.deck.length)return CB.reveal();

CB.callCabo=function(pi){

 G.caboBy=pi;G.finalLeft=G.players.length-1;botSay(pi,'cool',0.5);toast(`${nm(G.players[pi],'הכרזת','מכריז')} קאבו!`);

 G.turn=(G.turn+1)%G.players.length;CB.step();
};
CB.snapTry=function(pi,k){
 const p=G.players[pi];if(!['turn','drawn','ability'].includes(G.phase)||pi===G.caboBy)return;
 const top=G.discard[G.discard.length-1],c=p.slots[k];if(!top||!c)return;
 if(CB.rank(c)===CB.rank(top)){p.slots[k]=null;p.mem[k]=null;G.discard.push(c);G.lastId=c.id;toast(`${nm(p,'קאט מוצלח','קאט מוצלח')} – ${CB.label(c)}`);}
 else{if(G.deck.length){const pen=G.deck.pop();p.slots.push(pen);p.mem.push(null);}toast(`${nm(p,'קאט שגוי','קאט שגוי')} – ${CB.label(c)} לא מתאים, קלף עונשין`);CB.view(pi,pi,k,1500);}
 render();
};
CB.botSnaps=function(){
 const top=G.discard[G.discard.length-1];if(!top)return;
 for(const b of G.players.filter(x=>x.bot&&x.i!==G.caboBy)){
  const k=b.mem.findIndex((m,i)=>m&&b.slots[i]&&m.id===b.slots[i].id&&CB.rank(m)===CB.rank(top));
  if(k>=0&&Math.random()<[0.3,0.6,0.85][S.diff]){const g=G,id=top.id;later(()=>{if(G===g&&!G.roundOver&&G.discard.length&&G.discard[G.discard.length-1].id===id)CB.snapTry(b.i,k);},600+Math.random()*1200);break;}
 }
};
CB.estimate=p=>p.slots.reduce((s,c,i)=>c?s+(p.mem[i]&&p.mem[i].id===c.id?CB.val(c):6.5):s,0);
CB.worstKnown=p=>{let w=-1,k=-1;p.slots.forEach((c,i)=>{if(c&&p.mem[i]&&p.mem[i].id===c.id&&CB.val(c)>w){w=CB.val(c);k=i;}});return{k,w};};
CB.unknown=p=>p.slots.findIndex((c,i)=>c&&!(p.mem[i]&&p.mem[i].id===c.id));
CB.botAct=function(){
 const p=G.players[G.turn];if(G.phase!=='turn')return;
 const est=CB.estimate(p);
 if(G.caboBy<0&&G.turns>=G.players.length*2&&est<=[13,10,8][S.diff])return CB.callCabo(p.i);
 const top=G.discard[G.discard.length-1],wk=CB.worstKnown(p),uk=CB.unknown(p);
 if(top){const v=CB.val(top);
  if(wk.k>=0&&v<wk.w-3)return CB.takeDisc(p.i,wk.k);
  if(v<=2&&uk>=0)return CB.takeDisc(p.i,uk);}
 CB.draw(p.i);
};
CB.botDrawn=function(){
 const p=G.players[G.turn];if(G.phase!=='drawn')return;
 const v=CB.val(G.drawn.card),wk=CB.worstKnown(p),uk=CB.unknown(p);
 if(wk.k>=0&&v<wk.w)return CB.swapIn(p.i,wk.k);
 if(uk>=0&&v<=4)return CB.swapIn(p.i,uk);
 CB.discardDrawn(p.i);
};
CB.botAbility=function(){
 const p=G.players[G.turn];if(G.phase!=='ability')return;
 if(G.ab==='peek'){const k=CB.unknown(p);if(k>=0)return CB.useAbility(p.i,{k});return CB.useAbility(p.i,{skip:1});}
 if(G.ab==='swap'){const wk=CB.worstKnown(p);const opps=G.players.filter(o=>o.i!==p.i&&o.i!==G.caboBy&&o.slots.some(Boolean));
  if(wk.k>=0&&wk.w>=9&&opps.length){const o=opps[Math.floor(Math.random()*opps.length)];const js=o.slots.map((c,i)=>c?i:-1).filter(i=>i>=0);return CB.useAbility(p.i,{k:wk.k,p:o.i,j:js[Math.floor(Math.random()*js.length)]});}}

};
CB.kamikaze=p=>{const cs2=p.slots.filter(Boolean);return cs2.length===4&&cs2.filter(c=>c.r===13&&!RED[c.s]&&!c.jk).length===2&&cs2.filter(c=>c.r===12).length===2;};
CB.reveal=function(){
 clearTimeout(timer);clearTimeout(toTimer);
 G.roundOver=true;G.phase='reveal';G.drawn=null;
 const P=G.players,sums=P.map(p=>p.slots.reduce((s,c)=>s+CB.val(c),0));

 const kz=P.find(CB.kamikaze);
 if(kz){rs=P.map(p=>p===kz?0:sums[p.i]+50);G.rmsg=`${kz.i===myIdx?'קאמיקזה שלך!':kz.name+' עשה קאמיקזה!'} כל השאר +50`;}
 else if(G.caboBy>=0){
  const c=G.caboBy,others=P.filter(p=>p.i!==c).map(p=>sums[p.i]),mn=Math.min(...others);
  if(sums[c]<mn){rs[c]=0;G.rmsg=`${P[c].i===myIdx?'הקאבו שלך הצליח':P[c].name+' הצליח בקאבו'} – 0 נקודות`;}
  else{rs[c]=sums[c]+10;P.forEach(p=>{if(p.i!==c&&sums[p.i]===mn)rs[p.i]=0;});G.rmsg=`${P[c].i===myIdx?'הקאבו שלך נכשל':P[c].name+' נכשל בקאבו'} – קנס 10`;}
 }else G.rmsg='הקופה נגמרה – כל אחד מקבל את סכום הקלפים שלו';
 P.forEach((p,i)=>{p.sum=sums[i];p.roundScore=rs[i];p.total+=rs[i];});
 if(P.some(p=>p.total>=100)){
  G.over=true;
  const order=P.slice().sort((a,b)=>a.total-b.total);order.forEach((p,i)=>p.place=i+1);
  G.durak=order[order.length-1].i;
  if(!G.scored){G.scored=true;G.res=placeRes(p=>p.i===G.durak?-1:p.place===1?2:(p.place===2&&P.length>2)?1:0);addToBoard(G.res,'cabo');}
 }

};
CB.act=function(pi,a){
 if(!G||!a)return;
 if(a.t==='next'){if(pi===0&&G.roundOver&&!G.over)CB.newRound();return;}
 if(G.over)return;

  case 'draw':return CB.draw(pi);

  case 'swapin':return CB.swapIn(pi,a.k);
  case 'discard':return CB.discardDrawn(pi);
  case 'ability':return CB.useAbility(pi,a);
  case 'cabo':return CB.callCabo(pi);

CB.snap=function(){

 return {gm:'cabo',g:G.gid,ph:G.phase,tu:G.turn,rd:G.round,dk:G.deck.length,ds:enc(G.discard.slice(-1)),dn:G.discard.length,cb:G.caboBy,ab:G.ab||null,li:G.lastId,

CB.load=function(st){

 <p><b>קאט:</b> בכל רגע – גם לא בתורך – אם יש לך קלף זהה לקלף שבערימה, לחץ "קאט" וגע בו. צדקת – נפטרת ממנו. טעית – קלף עונשין.</p>
 <p><b>קאבו:</b> אחרי ההכרזה לכל השאר תור אחד אחרון. המכריז הנמוך ביותר מקבל 0; אחרת +10 קנס והנמוך מקבל 0.</p>
 <p><b>ערכים:</b> A=1, מספרים לפי ערכם, J=11, Q=12, מלך שחור 13, מלך אדום 0, ג׳וקר 0. <b>קאמיקזה:</b> שני מלכים שחורים ושתי מלכות – 0 לך ו־50 לכל השאר.</p>
 <button class="btn primary" data-a="close">הבנתי</button></div></div>`;
 return `<div class="ov" data-a="close"><div class="sheet" data-a="noop"><h2>חוקי השולחן</h2>
 <p><b>המטרה:</b> להיפטר מכל הקלפים. מי שנשאר אחרון עם קלפים הוא הדוראק.</p>
 <p><b>קוזר:</b> הצורה של הקלף שמתחת לקופה – מוצגת למעלה. קלפי קוזר מסומנים במסגרת זהב ומכים כל קלף שאינו קוזר.</p>
 <p><b>תקיפה:</b> התוקף שם קלף. להוסיף קלפים בדרגה שכבר על השולחן מותר רק <b>לשחקן שלפני המגן ולשחקן שאחריו</b> – עד <b>6 קלפי התקפה</b>, ולא יותר ממה שיש למגן ביד.</p>
 <p><b>הגנה:</b> מכים בקלף גבוה יותר מאותה צורה, או בקוזר. אי אפשר? "לקחת".</p>
 <p><b>העברה:</b> זרקו עליך 6 ויש לך 6? שים אותו (לחיצה כפולה) – ההתקפה עוברת לשחקן הבא, והוא צריך להכות, לקחת, או להעביר הלאה. אפשר רק לפני שהכית קלף, ורק אם לשחקן הבא יש מספיק קלפים.</p>
 <p><b>שעון:</b> לכל מהלך <b>20 שניות</b>. מגן שלא הספיק – לוקח. תוקף שלא הספיק – קלף עונשין והתור עובר. מוסיף שלא הספיק – נחשב כמוותר.</p>
 <p><b>תחבולות וחשיפה:</b> מהלך לא חוקי, שליפת קלף, הפלה מתחת לשולחן וכוח הגיבור. חשיפה נכונה – הרמאי לוקח את השולחן ומאבד את הכוח. טעות – 2 קלפי עונשין.</p>
 <p><b>ניקוד:</b> ראשון שיצא +2, שני +1, הדוראק −1, השאר 0.</p>
 <button class="btn primary" data-a="close">הבנתי</button></div></div>`;

 if(!mine)for(let i=0;i<k;i++){const ang=k>1?-34+68*i/(k-1):0;fan+=`<i style="transform:rotate(${ang}deg)"></i>`;}
 return `<div class="seat ${act?'turn':''} ${p.out?'out':''} ${tl?'tell':''} ${mine?'mine':''}" style="${pos};--c:${h.color}">
 ${mine?'':`<div class="fan">${fan}</div>`}
 <div class="med">${ring}${portrait(p.hero)}${p.powerLost?'<span class="lost">✕</span>':''}<span class="cntb">${p.out?'✓':p.hand.length}</span></div>

 let o='';
 if(G.peek&&(G.net||G.peek.pi===myIdx)&&G.peek.until>now)o+=`<div class="ov np"><div class="sheet" style="text-align:center"><h2>${esc(G.peek.title)}</h2><div class="peek">${G.peek.cards.map(c=>cardH(c)).join('')}</div><p>נעלם בעוד 3 שניות</p></div></div>`;
 if(G.flash&&G.flash.until>now)o+=`<div class="ov np"><div class="verdict ${G.flash.type==='false'?'false':''}"><h1>${G.flash.title}</h1><div class="sheet"><p>${G.flash.body}</p></div></div></div>`;
 if(V.ui==='cheat'){const sc=m.hand.find(x=>x.id===V.sel);o+=`<div class="ov" data-a="close"><div class="sheet" data-a="noop"><h2>תחבולות</h2>
  <p>היריבים לא רואים – אבל יכולים לחשוף אותך עד סוף ההתקפה הנוכחית.</p>
  <button class="btn ${V.cheatMode?'on':''}" data-a="cmode">מהלך לא חוקי${V.cheatMode?' · פעיל':''}<small>המהלך הבא שלך יתקבל גם אם אינו חוקי</small></button>
  <button class="btn" data-a="cextra">שליפת קלף נוסף<small>לקחת בשקט קלף מהקופה</small></button>
  <button class="btn" data-a="cdrop">הפלה מתחת לשולחן<small>${sc?'מפיל את '+cs(sc):'אחרי הלחיצה – גע בקלף שתרצה להפיל'}</small></button>
  <button class="btn ghost" data-a="close">סגור</button></div></div>`;}
 if(V.ui==='reveal'){
  const sus=G.players.filter(p=>p.i!==myIdx&&!p.out);
  o+=`<div class="ov" data-a="close"><div class="sheet" data-a="noop"><h2>מי רימה?</h2>
  <p>רק רמאות מההתקפה הנוכחית נחשבת. טעות – 2 קלפי עונשין.</p>
  ${sus.map(p=>`<button class="btn danger" data-a="accuse" data-v="${p.i}">${esc(p.name)}<small>${hero(p.hero).name}</small></button>`).join('')}
  <button class="btn ghost" data-a="close">ביטול</button></div></div>`;
 }
 if(V.ui==='end')o+=endOv();
 if(V.ui==='score')o+=scoreOv();
 if(V.ui==='share')o+=shareOv();
 if(UI.rules)o+=rulesOv();
 const rem=Math.max(0,G.deadline-now);
 const ts=G.toast&&G.toast.until>now?G.toast.t:null,vt=V.toast&&V.toast.until>now?V.toast.t:null;
 const showToast=vt||ts;
 setHTML(`<div id="game" class="p${n}">
 <div class="top"><button class="ib" data-a="menu">יציאה</button><span class="trumpchip">קוזר <b class="${RED[G.ts]?'red':''}">${G.ts}</b></span><span class="sp"></span>
 ${NET?`<button class="chip" dir="ltr" data-a="share">${esc(NET.code).toUpperCase()} ⤴</button>`:''}<span class="chip" title="תחבולות שלא נתפסו">🎭 ${myHidden()}</span>${chatBtn()}<button class="ib" data-a="score">טבלה</button><button class="ib" data-a="rules">?</button></div>
 <div class="arena"><div class="rt"><div class="rim"></div>${DIAMONDS}<div class="inlay"></div>${CREST}
  <div class="pile deck">${G.deck.length?`<div class="stack">${G.trump?cardH(G.trump,'tr'):''}${G.deck.length>1?'<div class="back"></div>':''}</div>`:`<div class="stack"></div>`}<span class="lbl">קופה ${G.deck.length}</span><span class="trlbl">קוזר ${G.ts}</span></div>
  <div class="pile disc"><div class="stack">${G.discard?'<div class="back"></div>'+(G.discard>3?'<div class="back"></div><div class="back"></div>':''):''}</div><span class="lbl">מוכים ${G.discard}</span>${G.table.length?`<span class="lbl">התקפה ${G.table.length}/${G.boutDef}</span>`:''}</div>
  <div class="tbl">${pairs}</div>
  ${seats}
  ${showToast?`<div class="toast">${esc(showToast)}</div>`:''}
 </div></div>
 <div class="status"><div class="msg">${statusText(a)}</div>${G.over?'':`<span class="tnum" id="tnum">${Math.ceil(rem/1000)}</span>`}</div>
 <div class="tbarw">${myTurn?`<div class="tbar" id="tbar" style="transform:scaleX(${Math.min(1,rem/TURN_MS)})"></div>`:''}</div>
 <div class="hand ${myTurn?'my':''} ${V.cheatMode?'cheaty':''}" style="--ov:${ov}px">${hand}</div>
 <div class="acts">${acts}</div>
 </div>${o}`);
 if(!G.net)G.lastId=-1;else G.lastId=-1;
 tickTimer();
}
function tickTimer(){
 if(screen!=='game'||!G||G.over||typeof document==='undefined'||typeof document.querySelectorAll!=='function')return;
 const rem=Math.max(0,G.deadline-Date.now()),f=Math.min(1,rem/TURN_MS),low=rem<5000;
 document.querySelectorAll('.tring .fg').forEach(el=>{el.style.strokeDashoffset=(201*(1-f)).toFixed(1);el.classList.toggle('low',low);});
 const t=document.getElementById('tnum');if(t){t.textContent=Math.ceil(rem/1000);t.classList.toggle('low',low);}
 const b=document.getElementById('tbar');if(b){b.style.transform=`scaleX(${f})`;b.classList.toggle('low',low);}
}
setInterval(tickTimer,100);
function endOv(){
 const d=G.durak,P=G.players;
 const res=(G.res||[]).map((r,i)=>Object.assign({},r,{i})).sort((a,b)=>b.pts-a.pts||(a.place||9)-(b.place||9));
 const mine=(G.res||[])[myIdx];
 const title=d===-1?'תיקו':d===myIdx?'אתה הדוראק':(mine&&mine.place===1?'ניצחת':'סיימת');
 const sub=d===-1?'כולם סיימו יחד':d===myIdx?'בפעם הבאה – תחבולות טובות יותר':`${esc(P[d].i===myIdx?'אתה':P[d].name)} הוא הדוראק`;
 const unc=G.unc||[];
 const canAgain=!NET||NET.role==='host';
 return `<div class="ov"><div class="sheet"><h2 style="font-size:32px">${title}</h2><p><b>${sub}</b></p>
 <h2 style="font-size:16px;margin-top:10px">נקודות המשחק</h2>
 <ul class="endl">${res.map(r=>`<li><span class="nm">${portrait(r.hero)}${esc(r.name)}<small>${r.durak?'דוראק':r.place===1?'יצא ראשון':r.place===2?'יצא שני':r.place?'מקום '+r.place:''}</small></span><span class="gp ${r.pts>0?'pos':r.pts<0?'neg':''}" dir="ltr">${r.pts>0?'+':''}${r.pts}</span></li>`).join('')}</ul>
 <h2 style="font-size:16px;margin-top:12px">טבלה מצטברת</h2>${scoreTable('durak')}
 <p style="font-size:12.5px;margin-top:10px">תחבולות שלא נתפסו (${unc.length}): ${unc.length?unc.map(esc).join(' · '):'אין'}</p>
 ${canAgain?`<button class="btn primary" data-a="again">סיבוב נוסף</button>`:`<button class="btn" disabled>ממתין שהמארח יתחיל סיבוב נוסף…</button>`}
 <button class="btn" data-a="score">טבלה מלאה והיסטוריה</button><button class="btn ghost" data-a="menu">יציאה לתפריט</button></div></div>`;
}

/* ================= EVENTS ================= */
if(app&&app.addEventListener){
app.addEventListener('input',e=>{
 if(e.target.id==='nick'){S.nick=e.target.value.slice(0,14);save();}
});
app.addEventListener('click',e=>{
 const t=e.target.closest('[data-a]');if(!t)return;
 const a=t.dataset.a,v=t.dataset.v;
 if(a==='noop'){e.stopPropagation();return;}
 switch(a){
  case 'hero':S.hero=v;save();if(NET&&NET.room&&screen==='lobby'){if(NET.role==='client')NET.room.presence({hero:v}).catch(()=>{});else hostPresence();}render();break;
  case 'deck':S.deck=+v;save();render();break;
  case 'bots':S.bots=+v;save();render();break;
  case 'seats':S.seats=+v;save();render();break;
  case 'diff':S.diff=+v;save();render();break;
  case 'solo':leaveNet();startNew();break;
  case 'game':S.game=v;S.roster=null;save();render();break;
  case 'shcard':SH.tap(+v);break;
  case 'shdown':if(G.turn===myIdx)act({t:'down',k:+v});break;
  case 'shready':act({t:'ready'});V.sel=null;render();break;
  case 'shplay':{const ids=(V.multi||[]).slice();V.multi=[];if(ids.length)act({t:'play',ids});render();break;}
  case 'shpick':V.multi=[];act({t:'pickup'});break;
  case 'cslot':CB.tapMine(+v);break;
  case 'oslot':CB.tapOpp(+t.dataset.p,+v);break;
  case 'cdraw':act({t:'draw'});break;
  case 'ctake':V.pending=V.pending==='take'?null:'take';note(V.pending?'גע בקלף שלך שיוחלף':'בוטל');break;
  case 'ccabo':act({t:'cabo'});break;
  case 'cdisc':act({t:'discard'});break;
  case 'cskip':V.sel=null;act({t:'ability',skip:1});break;
  case 'csnap':V.pending=V.pending==='snap'?null:'snap';render();break;
  case 'cnext':V.ui=null;if(NET&&NET.role==='client')break;act({t:'next'});break;
  case 'host':hostTable();break;
  case 'join':joinTable(UI.joinCode);break;
  case 'nojoin':UI.joinCode='';try{history.replaceState(null,'',location.pathname+location.search);}catch(err){}render();break;
  case 'joincode':{const el=document.getElementById('jcode');joinTable(el?el.value:'');break;}
  case 'rules':UI.rules=true;render();break;
  case 'chat':chatToggle(true);break;
  case 'close':UI.rules=false;UI.resetArm=false;UI.score=false;if(V.ui==='score')V.ui=G&&G.over?'end':null;else if(V.ui!=='end')V.ui=null;V.pending=V.pending==='drop'?null:V.pending;render();break;
  case 'score':UI.resetArm=false;if(screen==='game'&&G)V.ui='score';else UI.score=true;render();break;
  case 'sort':UI.sort=v;render();break;
  case 'sbreset':if(!UI.resetArm){UI.resetArm=true;render();break;}{const gm=UI.sbGame||(G&&G.type)||S.game||'durak';SBS[gm]={players:{},games:[]};}saveSB();UI.resetArm=false;render();break;
  case 'sbgame':UI.sbGame=v;UI.resetArm=false;render();break;
  case 'copy':{const txt=inviteText();try{navigator.clipboard.writeText(txt).then(()=>{t.textContent='הקישור הועתק ✓';},()=>{t.textContent='סמן את הקישור למטה והעתק';});}catch(err){t.textContent='סמן את הקישור למטה והעתק';}break;}
  case 'share':V.ui='share';render();break;
  case 'startnow':hostStart();break;
  case 'card':onHandTap(+v);break;
  case 'pair':onTableTap(+v);break;
  case 'take':act({t:'take'});break;
  case 'pass':act({t:'pass'});break;
  case 'transfer':transferUI();break;
  case 'power':powerUI();break;
  case 'cheat':V.ui='cheat';render();break;
  case 'cmode':cheatModeUI();break;
  case 'cextra':cheatExtraUI();break;
  case 'cdrop':cheatDropUI();break;
  case 'reveal':if(!G.over&&me().lock<G.bout){V.ui='reveal';render();}break;
  case 'accuse':V.ui=null;act({t:'reveal',s:+v});render();break;
  case 'again':clearTimeout(timer);clearTimeout(toTimer);if(NET&&NET.role==='host')hostAgain();else startNew(G.players.slice(1).map(p=>({name:p.name,hero:p.hero,kind:'bot'})));break;
  case 'menu':clearTimeout(timer);clearTimeout(toTimer);leaveNet();G=null;V={sel:null,pending:null,cheatMode:false,ui:null,toast:null};screen='menu';UI.rules=false;UI.score=false;render();break;
 }
});
}
render();
</script>
</body>
</html>
